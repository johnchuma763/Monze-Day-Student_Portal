<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Monze Day Secondary School</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }
    header {
      background: #123b68;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 21px; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 15px;
    }
    .logout { background: white; color: #123b68; }
    main { max-width: 950px; margin: 25px auto; padding: 0 15px; }
    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px #0000000c;
    }
    h2 { margin-top: 0; color: #123b68; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 16px;
      background: white;
    }
    .primary { background: #176b43; color: white; margin-top: 16px; }
    .secondary { background: #123b68; color: white; }
    #status { margin-top: 14px; white-space: pre-wrap; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { background: #edf3f8; }
    #app { display: none; }
    .muted { color: #64748b; }
    footer { text-align: center; padding: 20px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1>🎓 Monze Day — Admin Dashboard</h1>
    <button class="logout" id="logoutButton">Log Out</button>
  </header>

  <div id="loading" style="padding:30px;text-align:center">
    Checking administrator access...
  </div>

  <main id="app">
    <section class="card">
      <h2>Add Student</h2>
      <p class="muted">Enter the student's details below.</p>

      <form id="studentForm">
        <label for="studentNumber">Student Number</label>
        <input id="studentNumber" required maxlength="50"
               placeholder="e.g. MD001">

        <label for="fullName">Full Name</label>
        <input id="fullName" required maxlength="150"
               placeholder="Enter student's full name">

        <label for="className">Class</label>
        <select id="className" required>
          <option value="">Select class</option>
          <option>Form 1</option>
          <option>Form 2</option>
          <option>Form 3</option>
          <option>Form 4</option>
          <option>Form 5</option>
        </select>

        <button class="primary" type="submit">Save Student</button>
      </form>
      <div id="status" role="status"></div>
    </section>

    <section class="card">
      <h2>Student Records</h2>
      <button class="secondary" id="refreshButton" type="button">
        Refresh Records
      </button>
      <p class="muted">Student records saved in the database appear here.</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Student Number</th>
              <th>Full Name</th>
              <th>Class</th>
            </tr>
          </thead>
          <tbody id="studentRows">
            <tr><td colspan="3">Loading records...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>Monze Day Secondary School | Student Portal</footer>

  <script>
    const SUPABASE_URL = "https://rlgdmvgkzckvjzgcduyg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_h4jpZGxZ7EwwSxM6sq9K8A_2Cx7K1IG";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loading = document.getElementById("loading");
    const app = document.getElementById("app");
    const statusBox = document.getElementById("status");
    const studentRows = document.getElementById("studentRows");

    let authorized = false;

    async function checkAdminAccess() {
      try {
        const { data: { user }, error: authError } =
          await client.auth.getUser();

        if (authError || !user) {
          window.location.replace("login.html");
          return;
        }

        const { data: roleRecord, error: roleError } = await client
          .from("user_roles")
          .select("role")
          .eq("id", user.id)
          .maybeSingle();

        if (roleError || !roleRecord || roleRecord.role !== "admin") {
          loading.textContent =
            "Access denied. This account is not an administrator.";
          await client.auth.signOut();
          return;
        }

        authorized = true;
        loading.style.display = "none";
        app.style.display = "block";
        await loadStudents();
      } catch (error) {
        loading.textContent =
          "Could not verify access. Check your internet connection and reload.";
      }
    }

    document.getElementById("studentForm").addEventListener(
      "submit", async function(event) {
        event.preventDefault();

        if (!authorized) return;

        const student_number =
          document.getElementById("studentNumber").value.trim();
        const full_name =
          document.getElementById("fullName").value.trim();
        const class_name =
          document.getElementById("className").value;

        statusBox.textContent = "Saving student...";

        const { error } = await client.from("students").insert([{
          student_number,
          full_name,
          class_name
        }]);

        if (error) {
          statusBox.textContent =
            error.code === "23505"
              ? "That student number already exists. Use a unique number."
              : "Could not save student: " + error.message;
          return;
        }

        statusBox.textContent = "Student saved successfully!";
        this.reset();
        await loadStudents();
      }
    );

    async function loadStudents() {
      if (!authorized) return;

      studentRows.innerHTML =
        '<tr><td colspan="3">Loading records...</td></tr>';

      const { data, error } = await client
        .from("students")
        .select("student_number, full_name, class_name")
        .order("student_number", { ascending: true });

      if (error) {
        studentRows.innerHTML =
          '<tr><td colspan="3">Could not load records: ' +
          escapeHTML(error.message) + '</td></tr>';
        return;
      }

      if (!data || data.length === 0) {
        studentRows.innerHTML =
          '<tr><td colspan="3">No student records yet.</td></tr>';
        return;
      }

      studentRows.innerHTML = data.map(student =>
        '<tr><td>' + escapeHTML(student.student_number) +
        '</td><td>' + escapeHTML(student.full_name) +
        '</td><td>' + escapeHTML(student.class_name) +
        '</td></tr>'
      ).join("");
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char];
      });
    }

    document.getElementById("refreshButton").addEventListener(
      "click", loadStudents
    );

    document.getElementById("logoutButton").addEventListener(
      "click", async function() {
        await client.auth.signOut();
        window.location.replace("login.html");
      }
    );

    checkAdminAccess();
  </script>
</body>
          </html>
