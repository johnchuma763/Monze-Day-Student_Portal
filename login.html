<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Login | Monze Day Secondary School</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #edf4ff, #f8fbff);
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 32px 26px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 15px 35px #11223320;
    }

    .logo {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 16px;
      background: #123b2c;
      color: white;
      font-size: 26px;
      font-weight: bold;
    }

    h1 { text-align: center; color: #123b2c; }

    .subtitle {
      text-align: center;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      font-size: 16px;
    }

    input, select {
      border: 1px solid #cbd5e1;
      background: white;
    }

    button {
      margin-top: 22px;
      border: 0;
      background: #16845b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #message {
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #16845b;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">MD</div>
    <h1>Portal Login</h1>
    <p class="subtitle">
      Monze Day Secondary School<br>
      Sign in to access your account.
    </p>

    <form id="loginForm">
      <label for="role">Login as</label>
      <select id="role" required>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Admin</option>
      </select>

      <label for="email">Email Address</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Enter your registered email"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">Sign In</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <a class="back" href="index.html">← Back to Homepage</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase project settings
    const SUPABASE_URL =
      "https://rlgdmvgkzckvjzgcduyg.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_h4jpZGxZ7EwwSxM6sq9K8A_2Cx7K1IG";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      const role = document.getElementById("role").value;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        // Authenticate against Supabase Auth.
        const { data, error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) throw error;
        if (!data.user) throw new Error("User account was not returned.");

        // Retrieve the role assigned to this authenticated user.
        const { data: roleRecord, error: roleError } = await client
          .from("user_roles")
          .select("role")
          .eq("id", data.user.id)
          .maybeSingle();

        if (roleError) throw roleError;

        if (!roleRecord) {
          await client.auth.signOut();
          throw new Error(
            "No portal role is assigned to this account. Contact the administrator."
          );
        }

        if (roleRecord.role !== role) {
          await client.auth.signOut();
          throw new Error(
            "The selected role does not match your assigned account role."
          );
        }

        const pages = {
          admin: "admin-dashboard.html",
          teacher: "teacher-dashboard.html",
          student: "student-dashboard.html"
        };

        message.textContent = "Sign-in successful. Opening your dashboard...";

        window.location.replace(pages[role]);
      } catch (error) {
        console.error("Portal sign-in error:", error);
        message.textContent =
          error.message || "Unable to sign in. Please try again.";
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });
  </script>
</body>
    </html>
